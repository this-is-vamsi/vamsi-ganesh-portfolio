<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091526"/>
      <stop offset="55%" stop-color="#0f2942"/>
      <stop offset="100%" stop-color="#09131c"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <circle cx="400" cy="225" r="210" fill="#10b981" opacity="0.12" filter="blur(50px)"/>

  <rect x="48" y="36" width="245" height="30" rx="15" fill="rgba(16,185,129,0.14)" stroke="rgba(16,185,129,0.4)"/>
  <text x="170" y="56" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">LANGGRAPH REACT QC AGENT</text>

  <!-- Central ReAct Router Hub -->
  <g transform="translate(275, 115)">
    <rect width="250" height="96" rx="16" fill="rgba(15,23,42,0.92)" stroke="#34d399" stroke-width="2"/>
    <text x="125" y="38" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">REACT AGENT ROUTER</text>
    <text x="125" y="62" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Quality Control Brain</text>
    <text x="125" y="82" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">LangGraph + OpenAI Tool Call</text>
  </g>

  <!-- Branches Down -->
  <path d="M 330 211 L 195 275" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M 400 211 L 400 275" stroke="#34d399" stroke-width="2.5"/>
  <path d="M 470 211 L 605 275" stroke="#a78bfa" stroke-width="2.5"/>

  <!-- Left Node: 3 ML Models -->
  <g transform="translate(65, 275)">
    <rect width="230" height="115" rx="14" fill="rgba(15,23,42,0.9)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="115" y="34" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">3x SCIKIT-LEARN MODELS</text>
    <text x="115" y="60" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Defect &amp; Spec Predictors</text>
    <text x="115" y="85" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Pass / Fail Classification</text>
  </g>

  <!-- Center Node: Streamlit UI -->
  <g transform="translate(315, 275)">
    <rect width="170" height="115" rx="14" fill="rgba(15,23,42,0.9)" stroke="#34d399" stroke-width="1.5"/>
    <text x="85" y="34" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">STREAMLIT UI</text>
    <text x="85" y="62" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">No-Code Shopfloor</text>
    <text x="85" y="85" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Real-Time Alerts</text>
  </g>

  <!-- Right Node: ChromaDB RAG -->
  <g transform="translate(505, 275)">
    <rect width="230" height="115" rx="14" fill="rgba(15,23,42,0.9)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="115" y="34" fill="#a78bfa" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">CHROMADB VECTOR RAG</text>
    <text x="115" y="60" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SOP &amp; ISO Retriever</text>
    <text x="115" y="85" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Grounded QA Manuals</text>
  </g>
</svg>
