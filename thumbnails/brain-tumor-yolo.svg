<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b101e"/>
  <circle cx="400" cy="225" r="190" fill="#ec4899" opacity="0.14" filter="blur(50px)"/>
  <rect x="48" y="36" width="275" height="30" rx="15" fill="rgba(236,72,153,0.15)" stroke="rgba(236,72,153,0.45)"/>
  <text x="185" y="56" fill="#f472b6" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">MEDICAL MRI · YOLOv8 VS YOLOv12</text>
  <!-- MRI Scan Visual Left -->
  <g transform="translate(85, 95)">
    <rect width="260" height="260" rx="20" fill="#111827" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <ellipse cx="130" cy="135" rx="82" ry="98" fill="none" stroke="#475569" stroke-width="3"/>
    <ellipse cx="130" cy="135" rx="64" ry="78" fill="rgba(56,189,248,0.06)" stroke="#334155" stroke-width="1.5"/>
    <!-- Tumor Bounding Box -->
    <circle cx="155" cy="115" r="24" fill="rgba(244,114,182,0.35)"/>
    <rect x="122" y="82" width="66" height="66" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="122" y="62" width="92" height="20" rx="4" fill="#f472b6"/>
    <text x="168" y="76" fill="#0f172a" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Glioma 0.96</text>
  </g>
  <!-- Metrics Right -->
  <g transform="translate(390, 105)">
    <rect width="330" height="240" rx="16" fill="rgba(15,23,42,0.9)" stroke="rgba(255,255,255,0.12)"/>
    <text x="30" y="42" fill="#f8fafc" font-family="sans-serif" font-size="17" font-weight="bold">6,000 BRISC2025 MRI Scans</text>
    <text x="30" y="68" fill="#94a3b8" font-family="monospace" font-size="12">CNN Backbone vs. Area Self-Attention</text>
    <rect x="30" y="92" width="270" height="36" rx="8" fill="rgba(56,189,248,0.12)" stroke="#38bdf8"/>
    <text x="46" y="115" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">Dice Score &amp; Boundary IoU</text>
    <rect x="30" y="142" width="270" height="36" rx="8" fill="rgba(244,114,182,0.12)" stroke="#f472b6"/>
    <text x="46" y="165" fill="#f472b6" font-family="monospace" font-size="12" font-weight="bold">YOLOv12 Attention Segmentation</text>
    <text x="30" y="212" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold">PyTorch · 3 Tumor Classes · mAP</text>
  </g>
</svg>
