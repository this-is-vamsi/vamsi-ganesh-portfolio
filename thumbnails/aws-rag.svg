    <text x="80" y="42" fill="#818cf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">OPENSEARCH</text>
    <text x="80" y="72" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Serverless Index</text>
    <text x="80" y="96" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">k-NN Vector DB</text>
  </g>

  <path d="M 573 225 L 603 225" stroke="#34d399" stroke-width="2.5"/>

  <g transform="translate(603, 155)">
    <rect width="150" height="140" rx="14" fill="rgba(15,23,42,0.9)" stroke="#34d399" stroke-width="1.5"/>
    <text x="75" y="42" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">AWS BEDROCK</text>
    <text x="75" y="72" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Nova Lite Q&amp;A</text>
    <text x="75" y="96" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Cited Answers</text>
