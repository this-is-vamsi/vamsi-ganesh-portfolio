<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14111f"/>
      <stop offset="50%" stop-color="#1f172a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <circle cx="580" cy="200" r="190" fill="#f59e0b" opacity="0.14" filter="blur(45px)"/>

  <rect x="48" y="36" width="240" height="30" rx="15" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.45)"/>
  <text x="168" y="56" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">AWS SERVERLESS RAG</text>

  <!-- 4 Pipeline Blocks -->
  <g transform="translate(48, 155)">
    <rect width="150" height="140" rx="14" fill="rgba(15,23,42,0.9)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="75" y="42" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">AMAZON S3</text>
    <text x="75" y="72" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">PDF Ingestion</text>
    <text x="75" y="96" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Event Trigger</text>
  </g>

  <path d="M 198 225 L 228 225" stroke="#fbbf24" stroke-width="2.5"/>

  <g transform="translate(228, 155)">
    <rect width="155" height="140" rx="14" fill="rgba(15,23,42,0.9)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="77" y="42" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">AWS LAMBDA</text>
    <text x="77" y="72" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Titan Embeddings</text>
    <text x="77" y="96" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Chunking &amp; Vector</text>
  </g>

  <path d="M 383 225 L 413 225" stroke="#fbbf24" stroke-width="2.5"/>

  <g transform="translate(413, 155)">
