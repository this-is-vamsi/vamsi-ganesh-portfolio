<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vamsi Ganesh · AI &amp; Machine Learning Portfolio</title>
  <meta name="description" content="Vamsi Ganesh — M.Sc. AI student at OTH Amberg-Weiden, ex-Data Analyst at Bosch. Building AI agents, computer vision models in PyTorch, and Python/SQL data pipelines." />

  <!-- Fonts: Space Grotesk (Display/Headings), Plus Jakarta Sans (Body), JetBrains Mono (Tags/Code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Soft Architectural Blue Grid & Ambient Sky Glows -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
  </div>

  <!-- Top Navigation Bar (With EN | DE Switcher & Light/Dark Toggle) -->
  <header class="navbar">
    <div class="nav-inner">
      <a href="#hero" class="nav-brand">
        <span class="brand-monogram">VG</span>
        <span>Vamsi Ganesh</span>
      </a>

      <ul class="nav-links" id="navLinks"></ul>

      <div class="nav-actions">
        <div class="lang-switch" role="group" aria-label="Language switcher">
          <button type="button" class="lang-btn active" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="de">DE</button>
        </div>
        <button type="button" class="theme-toggle" id="themeToggleBtn" aria-label="Toggle theme"></button>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section id="hero">
    <div class="container" id="heroMount"></div>
  </section>

  <!-- About Section -->
  <section id="about" class="section-alt">
    <div class="container" id="aboutMount"></div>
  </section>

  <!-- Skills Section -->
  <section id="skills">
    <div class="container" id="skillsMount"></div>
  </section>

  <!-- Projects Section -->
  <section id="projects" class="section-alt">
    <div class="container" id="projectsMount"></div>
  </section>

  <!-- Experience Section -->
  <section id="experience">
    <div class="container" id="experienceMount"></div>
  </section>

  <!-- Education Section -->
  <section id="education" class="section-alt">
    <div class="container" id="educationMount"></div>
  </section>

  <!-- Certifications Section -->
  <section id="certifications">
    <div class="container" id="certificationsMount"></div>
  </section>

  <!-- Contact Section -->
  <section id="contact" class="section-alt">
    <div class="container" id="contactMount"></div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container" id="footerMount"></div>
  </footer>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
