<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vamsi Ganesh | AI &amp; Agentic Systems Engineer Portfolio</title>
  <meta name="description" content="Portfolio of Vamsi Ganesh — AI & Agentic Systems Engineer, M.Sc. AI at OTH Amberg-Weiden, Germany. LangGraph, RAG Pipelines, AWS Bedrock, PyTorch, Machine Learning." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Soft Ambient Background Glows -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
  </div>

  <!-- Top Navigation Bar (With EN | DE Switcher & Theme Toggle) -->
  <header class="navbar">
    <div class="nav-inner">
      <a href="#hero" class="nav-brand">
        <span class="brand-monogram">VG</span>
        <span>Vamsi Ganesh</span>
      </a>

      <ul class="nav-links" id="navLinks"></ul>

      <div class="nav-actions">
        <div class="lang-switch" role="group" aria-label="Language switcher">
          <button type="button" class="lang-btn active" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="de">DE</button>
        </div>
        <button type="button" class="theme-toggle" id="themeToggleBtn" aria-label="Toggle theme"></button>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section id="hero">
    <div class="container" id="heroMount"></div>
  </section>

  <!-- About Section -->
  <section id="about" class="section-alt">
    <div class="container" id="aboutMount"></div>
  </section>

  <!-- Skills Section -->
  <section id="skills">
    <div class="container" id="skillsMount"></div>
  </section>

  <!-- Projects Section (With 16:9 Visual Thumbnails) -->
  <section id="projects" class="section-alt">
    <div class="container" id="projectsMount"></div>
  </section>

  <!-- Experience Section -->
  <section id="experience">
    <div class="container" id="experienceMount"></div>
  </section>

  <!-- Education Section -->
  <section id="education" class="section-alt">
    <div class="container" id="educationMount"></div>
  </section>

  <!-- Certifications Section -->
  <section id="certifications">
    <div class="container" id="certificationsMount"></div>
  </section>

  <!-- Contact Section -->
  <section id="contact" class="section-alt">
    <div class="container" id="contactMount"></div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container">
      &copy; 2026 Vamsi Ganesh &nbsp;·&nbsp; AI &amp; Agentic Systems Engineering &nbsp;·&nbsp; Bavaria, Germany 🇩🇪
    </div>
  </footer>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
